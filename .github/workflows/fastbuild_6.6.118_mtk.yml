name: (天玑特供) 6.6.118 欧加真OKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118_mtk'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  CCACHE_KEY: ccache-ecsv4-mtk_6.6.118

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: '内核源码分支(标准分支/含 memcomp 内存压缩移植的 memcomp-port 分支)'
        required: true
        type: choice
        default: 'oneplus/mt6991_b_16.0.0_oneplus_ace5_ultra'
        options:
          - 'oneplus/mt6991_b_16.0.0_oneplus_ace5_ultra'
          - 'memcomp-port'
      memcomp_disable:
        description: '仅排查用：选择 memcomp-port 时关闭 memcomp 并恢复 ZRAM(正常使用请保持 false)'
        required: true
        type: boolean
        default: 'false'
      lto_fdo:
        description: '编译优化(none=关闭; thinlto=仅ThinLTO; fdo=ThinLTO+AutoFDO,使用内核自带GKI AFDO配置)'
        required: true
        type: choice
        default: 'fdo'
        options:
          - 'none'
          - 'thinlto'
          - 'fdo'
      ksu_type:
        description: 'KernelSU分支(BakaSU/SukiSU Ultra/KernelSU Next/KSU(原版)/FinaSU/midori/无内置KSU,默认BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'finasu'
          - 'midori'
          - 'none'
      ksun_hook:
        description: 'KernelSU Next钩子模式(inline/hybrid走dev-susfs; manual/kprobes/syscall_table走legacy分支, 仅ksunext生效)'
        required: true
        type: choice
        default: 'inline'
        options:
          - 'inline'
          - 'hybrid'
          - 'manual'
          - 'kprobes'
          - 'syscall_table'
      midori_hook:
        description: 'midori01/KernelSU钩子方式(仅ksu_type=midori生效): kprobes=main运行时; manual=xx+手动补丁; syscall_table=xx+篡改sys_call_table; branch_link=xx+覆写b/bl; deinlined=xx+SUSFS去内联; susfs_enable=true时所有方式均应用De-inlined SUSFS(kprobes会回落xx+branch_link)'
        required: true
        type: choice
        default: 'kprobes'
        options:
          - 'kprobes'
          - 'manual'
          - 'syscall_table'
          - 'branch_link'
          - 'deinlined'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.11.1+zstd 1.6.0 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang18工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev &
          #旧版完整指令：（由于经过验证大部分指令已内置于GitHub Action环境中，故进行精简）
          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev zip unzip ccache
          
          #使用最新版ccache-ECS（特化优化内核编译缓存，大幅提升二次不同配置编译速度）
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "正在克隆源码仓库..."
          KERNEL_BRANCH="${{ github.event.inputs.kernel_source }}"
          echo "当前内核源码分支：$KERNEL_BRANCH"
          if [[ "$KERNEL_BRANCH" == "memcomp-port" ]]; then
            KERNEL_DIR="android_kernel_oneplus_mt6991-memcomp-port"
          else
            KERNEL_DIR="android_kernel_oneplus_mt6991-oneplus-mt6991_b_16.0.0_oneplus_ace5_ultra"
          fi
          aria2c -s16 -x16 -k1M "https://github.com/SHuiTU68/android_kernel_oneplus_mt6991/archive/refs/heads/${KERNEL_BRANCH}.zip" -o common.zip &&
          unzip -q common.zip &&
          mv "$KERNEL_DIR" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang18工具链..." &&
          mkdir -p clang18 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
          unzip -q clang.zip -d clang18 &&
          rm -rf clang.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "所有源码及llvm-Clang18工具链初始化完成！"
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          # 设置ccache环境变量
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 确保ccache目录存在
          mkdir -p "$CCACHE_DIR"
          
          # 每次运行都重新配置缓存大小
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 显示初始缓存状态
          echo "ccache初始状态:"
          ccache -s
          
          # 如果缓存恢复命中，显示详细信息
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        run: |
          # 进入内核工作目录
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置BakaSU（由于SukiSU长期未维护无法正常编译，且BakaSU兼容sukisu管理器，故SukiSU源码仓库已重定向为bakasu）..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            if [[ ${{ github.event.inputs.ksun_hook }} == "inline" || ${{ github.event.inputs.ksun_hook }} == "hybrid" ]]; then
              # inline / hybrid 均使用 dev-susfs：SUSFS 内联钩子 + setuid/AVC 等钩子共存，
              # 管理器会依据 tracepoint/kprobe 能力自动报告为 Hybrid 或 Inline
              echo "正在配置KernelSU Next（${{ github.event.inputs.ksun_hook }} 钩子，dev-susfs）..."
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              cd KernelSU-Next
              rm -rf .git
              KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
              KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
              sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            else
              # manual / kprobes / syscall_table 使用 legacy 布局的 KernelSU-Next
              cd "$GITHUB_WORKSPACE/kernel_workspace"
              if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
                # 该 fork 基于 legacy（ksun v3.4.0）+ SUSFS v2.3.0 集成，保留 manual/kprobes/syscall_table 三种钩子
                echo "正在配置KernelSU Next（${{ github.event.inputs.ksun_hook }} 钩子，legacy + SUSFS）..."
                git clone --depth=1 -b ksun-v3.4.0-legacy-susfs-v2.3.0 https://github.com/wshamroukh/KernelSU-Next-SUSFS-kernelv4.19 KernelSU-Next
                ln -sfn ../../KernelSU-Next/kernel ./common/drivers/kernelsu
                grep -q "kernelsu" ./common/drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> ./common/drivers/Makefile
                grep -q 'source "drivers/kernelsu/Kconfig"' ./common/drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' ./common/drivers/Kconfig
              else
                echo "正在配置KernelSU Next（${{ github.event.inputs.ksun_hook }} 钩子，legacy）..."
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
              fi
              cd KernelSU-Next
              rm -rf .git
              # 版本号伪装为上游 dev 分支版本（与 inline/hybrid 完全一致）
              KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000 2>/dev/null || echo 31400)
              KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
              KSU_GIT_TAG=${KSU_GIT_TAG:-v0.0.1}
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
              sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
              # legacy 分支在 6.6 内核上的兼容修复（对 legacy+SUSFS fork 同样适用，均为幂等）
              # 1) app_profile.c 缺少分号；2) vfs_unlink 在 6.6 需要增加 mnt_idmap 参数
              sed -i 's/ret = -ENOMEM$/ret = -ENOMEM;/' kernel/policy/app_profile.c
              sed -i 's/vfs_unlink(d_inode(path\.dentry->d_parent), path\.dentry, NULL);/vfs_unlink(mnt_idmap(path.mnt), d_inode(path.dentry->d_parent), path.dentry, NULL);/' kernel/policy/allowlist.c
              grep -q "ret = -ENOMEM;" kernel/policy/app_profile.c || { echo "::error::legacy app_profile.c 修复失败"; exit 1; }
              grep -q "mnt_idmap(path.mnt)" kernel/policy/allowlist.c || { echo "::error::legacy allowlist.c vfs_unlink 修复失败"; exit 1; }
              # 3) sepolicy.h 缺少 ksu_dup_sepolicy/ksu_destroy_sepolicy 声明
              # 4) 6.6 的 selinux_state 已无 ss 成员，改用 policy->latest_granting
              grep -q "ksu_dup_sepolicy" kernel/selinux/sepolicy.h || perl -0pi -e 's{#include "ss/policydb\.h"\n}{#include "ss/policydb.h"\n\nstruct selinux_policy;\nstruct selinux_policy *ksu_dup_sepolicy(struct selinux_policy *old_pol);\nvoid ksu_destroy_sepolicy(struct selinux_policy *orig);\n}' kernel/selinux/sepolicy.h
              perl -0777 -pi -e 's/\t#if defined\(KSU_COMPAT_USE_SELINUX_STATE\)\n\tu32 seqno = selinux_state\.ss \? \+\+selinux_state\.ss->latest_granting : 1;/\t#if defined(KSU_COMPAT_USE_SELINUX_STATE) \&\& LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n\tu32 seqno = selinux_state.ss ? ++selinux_state.ss->latest_granting : 1;\n\t#elif defined(KSU_COMPAT_USE_SELINUX_STATE)\n\tu32 seqno = selinux_state.policy ? ++selinux_state.policy->latest_granting : 1;/' kernel/selinux/rules.c
              grep -q "ksu_destroy_sepolicy" kernel/selinux/sepolicy.h || { echo "::error::legacy sepolicy.h 修复失败"; exit 1; }
              if grep -q "u32 seqno = selinux_state\.ss" kernel/selinux/rules.c; then
                grep -q "u32 seqno = selinux_state.policy ? ++selinux_state.policy->latest_granting" kernel/selinux/rules.c || { echo "::error::legacy rules.c 修复失败"; exit 1; }
              fi
              # 5) 6.6 的 selinux_kernel_status_page 不再接收 selinux_state 参数
              perl -pi -e 's/selinux_kernel_status_page\(&selinux_state\)/selinux_kernel_status_page()/' kernel/feature/selinux_hide.c
              grep -q "selinux_kernel_status_page()" kernel/feature/selinux_hide.c || { echo "::error::legacy selinux_hide.c 修复失败"; exit 1; }
              # 6) sepolicy.c 未定义 SELINUX_POLICY_INSTEAD_SELINUX_SS，导致 ksu_dup_sepolicy/ksu_destroy_sepolicy 被编译掉
              grep -q "#define SELINUX_POLICY_INSTEAD_SELINUX_SS" kernel/selinux/sepolicy.c || perl -0pi -e 's{#include "compat/kernel_compat\.h" // Add check Huawei Device\n}{#include "compat/kernel_compat.h" // Add check Huawei Device\n\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#define SELINUX_POLICY_INSTEAD_SELINUX_SS\n#endif\n}' kernel/selinux/sepolicy.c
              # 7) symbol_resolver/patch_memory 仅在 syscall_table 模式加入，但 app_profile 始终引用
              perl -ni -e 'print unless /^kernelsu-objs \+= (hook\/patch_memory|infra\/symbol_resolver)\.o$/' kernel/Kbuild
              perl -pi -e 's{^kernelsu-objs \+= infra/su_mount_ns\.o$}{kernelsu-objs += infra/su_mount_ns.o\nkernelsu-objs += hook/patch_memory.o\nkernelsu-objs += infra/symbol_resolver.o}' kernel/Kbuild
              grep -q "^kernelsu-objs += infra/symbol_resolver.o$" kernel/Kbuild || { echo "::error::legacy Kbuild 修复失败"; exit 1; }
              # 8) 该厂商 6.6 内核的 LSM 钩子仍是旧签名（无 mnt_idmap/user_namespace 参数）
              perl -0pi -e 's{#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 3, 0\)\n(static )?int ksu_inode_rename}{#if 0\n$1int ksu_inode_rename}; s{#elif LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 12, 0\)\n(static )?int ksu_inode_rename}{#elif 0\n$1int ksu_inode_rename}; s{#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 3, 0\)\n(static )?int ksu_inode_permission}{#if 0\n$1int ksu_inode_permission}; s{#elif LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 12, 0\)\n(static )?int ksu_inode_permission}{#elif 0\n$1int ksu_inode_permission}' kernel/hook/lsm_hooks.c
              [[ $(grep -c "^#if 0$" kernel/hook/lsm_hooks.c) -ge 2 ]] || { echo "::error::legacy lsm_hooks.c 修复失败"; exit 1; }
              # 9) legacy + SUSFS：oki v2.3.0 内核补丁（面向 KernelSU main）会引用一批 legacy 分支不存在的符号，
              #    在此提供等价定义/空实现，否则 vmlinux 链接失败
              if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
                # 9.1 fake_status / initialize_fake_status 需对 security/selinux 可见
                sed -i 's/^static struct page \*fake_status = NULL;/struct page *fake_status = NULL;/' kernel/feature/selinux_hide.c
                sed -i 's/^static void initialize_fake_status(void)$/void initialize_fake_status(void)/' kernel/feature/selinux_hide.c
                grep -q "^struct page \*fake_status = NULL;" kernel/feature/selinux_hide.c || { echo "::error::legacy susfs fake_status 修复失败"; exit 1; }
                grep -q "^void initialize_fake_status(void)$" kernel/feature/selinux_hide.c || { echo "::error::legacy susfs initialize_fake_status 修复失败"; exit 1; }
                # 9.2 补齐内核补丁引用的静态键/全局变量，以及两个 legacy 不需要的钩子
                if ! grep -q "legacy + SUSFS v2.3.0 兼容层" kernel/feature/selinux_hide.c; then
                  cat >> kernel/feature/selinux_hide.c <<'KSU_SUSFS_COMPAT'

          /* ===== legacy + SUSFS v2.3.0 兼容层 ===== */
          DEFINE_STATIC_KEY_FALSE(ksu_is_input_hook_enabled);
          DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);
          DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key);
          bool ksu_selinux_hide_enabled __read_mostly = true;
          bool ksu_selinux_hide_running __read_mostly = false;

          /* main 分支在 execve 成功后安装 su fd；legacy 已在 execve 前完成，无需额外动作 */
          int ksu_handle_post_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				      void *argv, void *envp, int *flags,
          				      int *retval)
          {
          	return 0;
          }

          /* main 分支用于 init.rc 大小伪装；legacy 不支持该功能，保持原值 */
          void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr)
          {
          }
          KSU_SUSFS_COMPAT
                fi
                # 9.3 selinux/rules.c：定义 backup_sepolicy，并在应用规则前备份原始策略
                grep -q "^struct selinux_policy \*backup_sepolicy;" kernel/selinux/rules.c || perl -0pi -e 's/#define ALL NULL\n/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\nstruct selinux_policy *backup_sepolicy;\n#endif\n\n#define ALL NULL\n/' kernel/selinux/rules.c
                if ! grep -q "backup_sepolicy = bp;" kernel/selinux/rules.c; then
                  perl -0pi -e 's{\tmutex_lock\(&selinux_state\.policy_mutex\);\n\tpol = ksu_dup_sepolicy\(rcu_dereference_protected\(old_pol, lockdep_is_held\(&selinux_state\.policy_mutex\)\)\);}{\tmutex_lock(&selinux_state.policy_mutex);\n\tif (!backup_sepolicy) {\n\t\textern bool ksu_selinux_hide_running;\n\t\tstruct selinux_policy *bp = ksu_dup_sepolicy(rcu_dereference_protected(old_pol, lockdep_is_held(&selinux_state.policy_mutex)));\n\t\tif (bp) {\n\t\t\tbp->sidtab = kzalloc(sizeof(*bp->sidtab), GFP_KERNEL);\n\t\t\tif (bp->sidtab && !policydb_load_isids(&bp->policydb, bp->sidtab)) {\n\t\t\t\tbackup_sepolicy = bp;\n\t\t\t\tksu_selinux_hide_running = true;\n\t\t\t} else {\n\t\t\t\tkfree(bp->sidtab);\n\t\t\t\tksu_destroy_sepolicy(bp);\n\t\t\t}\n\t\t}\n\t}\n\tpol = ksu_dup_sepolicy(rcu_dereference_protected(old_pol, lockdep_is_held(&selinux_state.policy_mutex)));}' kernel/selinux/rules.c
                fi
                grep -q "backup_sepolicy = bp;" kernel/selinux/rules.c || { echo "::error::legacy susfs backup_sepolicy 修复失败"; exit 1; }
                grep -q "def ksu_handle_post_execveat_sucompat\|int ksu_handle_post_execveat_sucompat" kernel/feature/selinux_hide.c || { echo "::error::legacy susfs 兼容层写入失败"; exit 1; }
              fi
            fi
            #为KernelSU Next添加WildKSU管理器支持
            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          elif [[ ${{ github.event.inputs.ksu_type }} == "finasu" ]]; then
            echo "正在配置FinaSU..."
            curl -LSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/refs/heads/master/kernel/setup.sh" | bash -s master
            cd ./FinaSU
            KSU_VERSION=$(expr $(git rev-list --count HEAD) + 30000 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            MIDORI_HOOK="${{ github.event.inputs.midori_hook }}"
            MIDORI_BRANCH="main"
            if [[ "$MIDORI_HOOK" != "kprobes" ]]; then
              MIDORI_BRANCH="xx"
            elif [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
              echo "警告：main 分支不支持 SUSFS，kprobes + SUSFS 回落到 xx + branch_link"
              MIDORI_BRANCH="xx"
            fi
            if [[ "$MIDORI_HOOK" == "deinlined" && "${{ github.event.inputs.susfs_enable }}" != "true" ]]; then
              echo "警告：未开启 susfs，deinlined 按普通 xx 驱动构建"
            fi
            echo "正在配置 midori01/KernelSU (分支 $MIDORI_BRANCH, 钩子 $MIDORI_HOOK)..."
            # 统一用 MidoriSU(main) 的提交数计算版本，避免 main/xx 分支版本号不一致
            MIDORI_COMMITS=$(curl -sI -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/midori01/KernelSU/commits?sha=main&per_page=1" | grep -i "^link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            if [ -z "$MIDORI_COMMITS" ]; then
              MIDORI_COMMITS=2808
            fi
            KSU_VERSION=$(expr "$MIDORI_COMMITS" + 30999)
            curl -LSs "https://raw.githubusercontent.com/midori01/KernelSU/$MIDORI_BRANCH/kernel/setup.sh" | bash -s "$MIDORI_BRANCH"
            cd ./KernelSU
            # 对齐 MidoriSU 管理器：统一包名/版本，绕过 APK 签名校验（与 gki_ksu_workflow 一致）
            sed -i 's/\(unsigned char buffer\[0x1[01]\] = { 0 };\)/return true;\n\t\1/g' kernel/manager/apk_sign.c 2>/dev/null || true
            sed -i '1i KSU_MANAGER_PACKAGE := com.midori.supermanager' kernel/Kbuild 2>/dev/null || true
            sed -E -i 's|^[[:space:]]*KSU_PACKAGE_NAME[[:space:]]*[:?]*=.*|KSU_PACKAGE_NAME := com.midori.supermanager|g' kernel/Kbuild kernel/Makefile 2>/dev/null || true
            sed -i 's|#define test_extra_pkgs(tgt).*|#define test_extra_pkgs(tgt) 0|' kernel/manager/throne_tracker.c 2>/dev/null || true
            sed -i "s|^ccflags-y += -DKSU_VERSION=.*|ccflags-y += -DKSU_VERSION=${KSU_VERSION}|" kernel/Kbuild 2>/dev/null || true
            sed -i "s|^CFLAGS_ksu\.o += -DKSU_VERSION=.*|CFLAGS_ksu.o += -DKSU_VERSION=${KSU_VERSION}|" kernel/Makefile 2>/dev/null || true
            sed -i "s|^REPO_NAME := .*|REPO_NAME := MidoriSU|" kernel/Kbuild 2>/dev/null || true
            if grep -q "KSU_HACK_ARM64_BRANCH_LINK" kernel/Kconfig; then
              echo "检测结果：该分支支持 Branch Link Hijacking / Syscall Table Tampering / Manual"
            else
              echo "检测结果：无源码级钩子选项，使用 KPROBES + 运行时 syscall table patch + LSM"
            fi
            if [[ "$MIDORI_HOOK" == "manual" ]]; then
              echo "应用 midori manual hooks 补丁..."
              cd "$GITHUB_WORKSPACE/kernel_workspace/common"
              wget -q https://raw.githubusercontent.com/midori01/gki_ksu_workflow/main/.github/patches/android15-6.6/scope-min-manual-hooks-v2.3.patch -O "$RUNNER_TEMP/manual-hooks.patch"
              patch -p1 -F 3 < "$RUNNER_TEMP/manual-hooks.patch"
              cd ../KernelSU
            fi
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" && ${{ github.event.inputs.ksu_type }} != "midori" ]]; then
            echo "正在添加susfs补丁..."
            git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/69_hide_stuff.patch -O ./common/69_hide_stuff.patch
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            # v2.3.0 的 susfs_def.h 只包含 bits/string，需补上线程标志与 cred 头
            if [[ -f ./common/include/linux/susfs_def.h ]]; then
              sed -i '0,/#include <linux\/string.h>/s//#include <linux\/string.h>\n#include <linux\/sched.h>\n#include <linux\/thread_info.h>\n#include <linux\/cred.h>/' ./common/include/linux/susfs_def.h
            fi
            cd ./common
            patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
            if [[ ${{ github.event.inputs.ksu_type }} == "ksunext" && ( ${{ github.event.inputs.ksun_hook }} == "manual" || ${{ github.event.inputs.ksun_hook }} == "kprobes" || ${{ github.event.inputs.ksun_hook }} == "syscall_table" ) ]]; then
              echo "正在适配 legacy 分支的 sucompat/SUSFS 钩子类型..."
              # legacy 分支用 bool 表示 su_compat 开关，内核补丁按 static_key 处理会读越界
              sed -i 's/extern struct static_key_true ksu_su_compat_enabled;/extern bool ksu_su_compat_enabled;/' fs/exec.c fs/open.c fs/stat.c
              sed -i 's/static_branch_likely(&ksu_su_compat_enabled)/ksu_su_compat_enabled/g' fs/exec.c fs/open.c fs/stat.c
              # legacy 分支未使用 input/init.rc 静态键，统一定义为关闭，避免 kprobes 下每次 read 都走钩子
              sed -i 's/extern struct static_key_true ksu_is_input_hook_enabled;/extern struct static_key_false ksu_is_input_hook_enabled;/' drivers/input/input.c
              sed -i 's/extern struct static_key_true ksu_is_init_rc_hook_enabled;/extern struct static_key_false ksu_is_init_rc_hook_enabled;/' fs/read_write.c fs/stat.c
            fi
            cd ..
          elif [[ ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            echo "正在应用 De-inlined SUSFS (midori xx)..."
            rm -rf susfs4ksu
            git clone --depth=1 -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }} https://github.com/midori01/susfs4ksu.git susfs4ksu
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            wget -q https://raw.githubusercontent.com/midori01/gki_ksu_workflow/main/.github/scripts/susfs_deinlined.sh -O "$RUNNER_TEMP/susfs_deinlined.sh"
            bash "$RUNNER_TEMP/susfs_deinlined.sh" ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch "$RUNNER_TEMP/deinlined.patch"
            cd ./common
            patch -p1 -F 3 < "$RUNNER_TEMP/deinlined.patch"
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            cd ./KernelSU
            patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch || true
          fi
          
      - name: 应用lz4 1.11.1 & zstd 1.6.0补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.11.1 & zstd 1.6.0补丁…"
          cd kernel_workspace
          git clone --depth=1 https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME $GITHUB_ACTOR
          cp ./$GITHUB_ACTOR/zram_patch/001-lz4.patch ./common/
          cp ./$GITHUB_ACTOR/zram_patch/001-lz4-clearMake.patch ./common/
          cp ./$GITHUB_ACTOR/zram_patch/lz4armv8.S ./common/lib
          cp ./$GITHUB_ACTOR/zram_patch/002-zstd.patch ./common/
          cd ./common
          git apply -p1 < 001-lz4.patch || true
          git apply -p1 < 001-lz4-clearMake.patch || true
          patch -p1 -F 3 < 002-zstd.patch || true

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          if [ ! -d "SukiSU_patch" ]; then
            git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          fi
          cd common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true
          
      - name: 添加SUSFS 配置项
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> ./common/arch/arm64/configs/gki_defconfig
          
      - name: 添加 KSU & 其他配置项
        run: |
          cd kernel_workspace
          echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ ${{ github.event.inputs.ksu_type }} == "finasu" || ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            echo "CONFIG_KALLSYMS_ALL=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            # midori01/KernelSU 运行时钩子依赖：kprobes + ext4 符号 + 全量 kallsyms
            echo "CONFIG_KPROBES=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_EXT4_FS=y" >> ./common/arch/arm64/configs/gki_defconfig
            case "${{ github.event.inputs.midori_hook }}" in
              syscall_table)
                echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> ./common/arch/arm64/configs/gki_defconfig
                ;;
              branch_link)
                echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> ./common/arch/arm64/configs/gki_defconfig
                ;;
              kprobes)
                if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
                  # main 驱动无 SUSFS 集成，回落 xx 时用 branch_link 作为运行时钩子
                  echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> ./common/arch/arm64/configs/gki_defconfig
                fi
                ;;
            esac
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            case "${{ github.event.inputs.ksun_hook }}" in
              manual)
                echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
                ;;
              kprobes)
                echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KSU_KPROBES_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
                ;;
              syscall_table)
                echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> ./common/arch/arm64/configs/gki_defconfig
                echo "CONFIG_KSU_SYSCALL_TABLE_HOOK=y" >> ./common/arch/arm64/configs/gki_defconfig
                ;;
            esac
          fi
          if [[ "${{ github.event.inputs.susfs_enable }}" == "false" ]]; then
            echo "CONFIG_KSU_SUSFS=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          #添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4HC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4K=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_LZ4KD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_842=y" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 开启O2编译优化配置
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/gki_defconfig
          #禁用 defconfig 检查
          sed -i 's/check_defconfig//' ./common/build.config.gki
          # KernelSU Next (dev-susfs) 与 FinaSU 的 preinit 功能需要 usr/include 下的 UAPI 头文件
          if [[ ( ${{ github.event.inputs.ksu_type }} == "ksunext" && ( ${{ github.event.inputs.ksun_hook }} == "inline" || ${{ github.event.inputs.ksun_hook }} == "hybrid" ) ) || ${{ github.event.inputs.ksu_type }} == "finasu" ]]; then
            echo "CONFIG_HEADERS_INSTALL=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            #跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
            echo "CONFIG_HEADERS_INSTALL=n" >> ./common/arch/arm64/configs/gki_defconfig
          fi
          # 应用 CVE_2026_43499 修复补丁
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/cve-2026-43499-rtmutex-6.6.patch
          patch -p1 -F 3 < cve-2026-43499-rtmutex-6.6.patch
          
      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          cd kernel_workspace
          #开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理,提高防火墙规则处理效率,减少内存占用
          echo "CONFIG_IP_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./common/arch/arm64/configs/gki_defconfig
          #启用 IPv6 网络地址转换
          echo "CONFIG_IP6_NF_NAT=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> ./common/arch/arm64/configs/gki_defconfig
          #由于部分机型的vintf兼容性检测规则，在开启CONFIG_IP6_NF_NAT后开机会出现"您的设备内部出现了问题。请联系您的设备制造商了解详情。"的提示，故添加一个配置修复补丁，在编译内核时隐藏CONFIG_IP6_NF_NAT=y但不影响对应功能编译
          cd common
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/config.patch
          patch -p1 -F 3 < config.patch || true

      - name: 添加 BBR 等一系列拥塞控制算法
        run: |
          if [[ "${{ github.event.inputs.bbr_enable }}" != "false" ]]; then
            echo "正在添加BBR等拥塞控制算法..."
            cd kernel_workspace
            #开启TCP拥塞控制算法控制器（必需）
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            ################################################################################################################################
            # BBR：基于链路容量的代表拥塞控制算法，不再使用丢包、延时等信号去衡量拥塞是否发生，而是直接对网络建模来应对、避免真实的网络拥塞；
            # 具有高吞吐、低延迟、抗丢包的特点，但在手机上使用时由于持续探测带宽/RTT、高频计算与发包增加 CPU 和射频模块功耗，会增加耗电及发热；
            # 且移动基站缓冲区深度通常较小（~50ms），BBR 的带宽探测阶段（ProbeRTT）过度降窗可能导致吞吐量骤降，且网络切换（WiFi→5G）时需重新
            # 探测参数，反而增加延迟或导致速率振荡（短暂卡顿），且存在 RTT 不公平性，与基于丢包的流竞争时可能过于强势，在混合网络环境中
            #（如 BBR + CUBIC 共存），BBR 会抢占更多其他软件的带宽，降低其他应用的公平性（如后台软件更新影响前台视频播放）。
            # 因此，虽然BBR可以显著减少排队延迟，抗丢包能力强，带宽利用率高，但由于其会增加耗电，且易导致网络速率波动，故安卓系统默认不使用
            # BBR拥塞算法，而是使用在吞吐量、稳定性、兼容性、能效之间取得最佳平衡的CUBIC算法。在开启BBR前，请考虑自己是否真的有使用BBR的必要。
            ################################################################################################################################
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            #CUBIC：安卓的默认TCP拥塞控制算法，在吞吐量、稳定性、兼容性、能效之间取得最佳平衡，具有高兼容性与公平性、抗网络波动性强、低计算开销的特点，是绝大部分移动场景的优先选择
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            #VEGAS：基于时延的拥塞控制算法之一，将回路响应时间（Round Trip Time，RTT）增加视为出现拥塞，增加时增大拥塞窗口，减小时减小拥塞窗口
            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            #New Vegas：Vegas 算法的改进版，优化了 RTT 测量和竞争公平性，可以更准确地检测拥塞，与 Reno/CUBIC 共存能力提升
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            #Westwood+：基于带宽估计（ACK 到达率）动态设置拥塞窗口和慢启动阈值；快速恢复，适合无线网络（区分拥塞丢包与无线丢包）
            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            #HTCP：一种基于损失的算法，使用 AIMD 来控制拥塞窗口，根据 RTT 动态调整增长因子，结合延迟和丢包信号，针对高延迟的高速网络进行优化
            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            #brutal：一种通过主动探测 + 激进抢占最大化吞吐量的拥塞算法，无拥塞窗口上限，轻度丢包（<20%）不降窗，避免类似 BBR 的 ProbeRTT 阶段，
            #持续维持高发送速率，与 Reno/CUBIC 共存时，Brutal 可通过高频发包抢占 90%+ 带宽，适用于高丢包弱网环境（如公共 Wi-Fi、蜂窝网络）及
            #直播推流、云游戏上行链路等需优先保证吞吐量而非延迟敏感的场景，提升弱网吞吐性能，对抗运营商 QoS 限速。但由于TCP Brutal 仅在应用程序
            #对每个 TCP 连接设置带宽参数之后才能正常工作，绝大部分安卓应用都不支持该操作，故请勿将 TCP Brutal 设置成默认拥塞控制算法。
            echo "CONFIG_TCP_CONG_BRUTAL=y" >> ./common/arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.bbr_enable }}" == "default" ]]; then
              echo "正在将BBR设为默认拥塞控制算法..."
              echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> ./common/arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用 Droidspaces 容器支持
        run: |
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            echo "正在启用 Droidspaces 容器支持..."
            cd kernel_workspace/common
            # 应用 Droidspaces 容器必须补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || true
            # 修补 oplus_bsp_midas 行为，避免开机崩溃
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/fix_oplus_bsp_midas.patch
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || true
            # 应用 NTSync 补丁
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_base.patch
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            patch -p1 -F 3 < ntsync_base.patch || true
            patch -p1 -F 3 < ntsync_compat_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            # 开启 Droidspaces 容器所需内核支持
            echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_USER_NS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
            # 未经测试的配置选项，可能导致bug
            #echo "CONFIG_CGROUP_DEVICE=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_CGROUP_PIDS=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_FW_LOADER_COMPRESS=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_BRIDGE_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
            #echo "CONFIG_NF_TABLES=y" >> ./arch/arm64/configs/gki_defconfig
            # 开启 NTSync
            echo "CONFIG_NTSYNC=y" >> ./arch/arm64/configs/gki_defconfig
            if [[ "${{ github.event.inputs.droidspaces_enable }}" == "extend" ]]; then
              echo "正在启用容器环境扩展支持..."
              # 开启虚拟 HCI 设备支持
              echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
              # 开启 systemd-coredump 支持
              echo "CONFIG_STATIC_USERMODEHELPER=n" >> ./arch/arm64/configs/gki_defconfig
              # 添加 Lindroid EVDI DRM 驱动
              wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/droidspaces_patch/evdi_drm.patch
              patch -p1 -F 3 < evdi_drm.patch || true
              echo "CONFIG_DRM_LINDROID_EVDI=y" >> ./arch/arm64/configs/gki_defconfig
            fi
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          echo "正在启用ADIOS IO调度器(将截止时间优先调度算法与基于自主学习的自适应延迟控制算法相结合, 降低I/O延迟)…"
          cd kernel_workspace
          wget -q https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/adios/adios.c -O ./common/block/adios.c
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 应用 memcomp 配置
        if: inputs.kernel_source == 'memcomp-port'
        run: |
          cd kernel_workspace
          if [[ "${{ github.event.inputs.memcomp_disable }}" == "true" ]]; then
            echo "排查模式：关闭 memcomp，恢复 ZRAM 以验证分支基线…"
            echo "# CONFIG_MEMCOMP is not set" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM=m" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_WRITEBACK=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZRAM_MULTI_COMP=y" >> ./common/arch/arm64/configs/gki_defconfig
          else
            echo "检测到 memcomp-port 源码分支，应用 memcomp 内存压缩配置…"
            echo "CONFIG_SWAP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_MEMCOMP=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo 'CONFIG_MEMCOMP_DEFAULT_COMPRESSOR="zstd"' >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_CRYPTO_ZSTD=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "CONFIG_ZSMALLOC=y" >> ./common/arch/arm64/configs/gki_defconfig
            echo "# CONFIG_ZRAM is not set" >> ./common/arch/arm64/configs/gki_defconfig
            echo "# CONFIG_ZSWAP is not set" >> ./common/arch/arm64/configs/gki_defconfig
          fi

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          echo "正在启用Re-Kernel支持(用于与Freezer,NoActive等软件配合使用,提升冻结后台能力)…"
          cd kernel_workspace
          echo "CONFIG_REKERNEL=y" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          echo "正在启用启用内核级基带保护支持…"
          cd kernel_workspace
          echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/gki_defconfig
          cd ./common
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "当前内核版本后缀：${{ github.event.inputs.kernel_suffix }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ github.event.inputs.KERNEL_SUFFIX }}/g' ./common/arch/arm64/configs/gki_defconfig
          else
            echo "当前内核版本后缀：${{ env.KERNEL_NAME }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig
          fi
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 应用 ThinLTO / AutoFDO 编译优化
        if: inputs.lto_fdo != 'none'
        run: |
          cd kernel_workspace
          echo "启用 ThinLTO 编译..."
          echo "# CONFIG_LTO_NONE is not set" >> ./common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_LTO_CLANG_THIN=y" >> ./common/arch/arm64/configs/gki_defconfig
          if [[ "${{ github.event.inputs.lto_fdo }}" == "fdo" ]]; then
            if [ -f ./common/android/gki/aarch64/afdo/kernel.afdo ]; then
              echo "启用 AutoFDO 编译(使用内核自带 GKI AFDO 配置)..."
              echo "CONFIG_AUTOFDO_CLANG=y" >> ./common/arch/arm64/configs/gki_defconfig
            else
              echo "警告：未找到 android/gki/aarch64/afdo/kernel.afdo，仅启用 ThinLTO"
            fi
          fi
            
      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"
          
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          
          cd kernel_workspace/common
          AFDO_ARGS=""
          if [[ "${{ github.event.inputs.lto_fdo }}" == "fdo" && -f ./android/gki/aarch64/afdo/kernel.afdo ]]; then
            AFDO_ARGS="CLANG_AUTOFDO_PROFILE=$(pwd)/android/gki/aarch64/afdo/kernel.afdo"
          fi
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          #创建 CC (编译器) 包装器
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          #创建 LD (链接器) 包装器
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          
          # 测试时间劫持测试是否正常工作
          echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper 内部环境检查完毕."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh # 执行所有传入的参数
          chmod +x test-wrapper.sh
          echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"
          ./test-wrapper.sh date
          echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"
          ./test-wrapper.sh stat ./Makefile
          echo "--- [Wrapper Test] 测试完毕 ---"
          chmod +x cc-wrapper ld-wrapper
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译前环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          
          #在构建内核的同时清除不必要的.NET, Android NDK, Haskell, CodeQL运行库，清理空间且不阻塞后续步骤运行
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error $AFDO_ARGS Image
          
          # 编译后时间劫持二次校验
          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译后环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "内核编译完成！"
          echo "ccache状态："
          ccache -s
          echo "编译后空间:"
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
         
      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x ./kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image
          
      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "finasu" ]]; then
            KSU_TYPENAME="FinaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            KSU_TYPENAME="KSUMidori"
          else
            KSU_TYPENAME="none"
          fi
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            wget https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$GITHUB_REF_NAME/zram.zip
          fi
          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' ]]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          
          #为AK3添加注释（调试信息）
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "susfs: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }}" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "LTO/FDO: ${{ github.event.inputs.lto_fdo }}" >> ./ak3.log
          echo "MIDORI_HOOK: ${{ github.event.inputs.midori_hook }}" >> ./ak3.log
          echo "IPset: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          archive: true

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="OPPO-OPlus-Realme-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "finasu" ]]; then
            KSU_TYPENAME="FinaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "midori" ]]; then
            KSU_TYPENAME="KernelSU (midori/${{ github.event.inputs.midori_hook }})"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV
         
      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 欧加真 ${{ env.KSU_TYPENAME }} MT6991 通用内核 | 构建信息
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：欧加真天玑9400+通用 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核（基于一加Ace5 Ultra ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 版官方OKI源码）
          - KSU分支：${{ env.KSU_TYPENAME }}
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持 ：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - ADIOS IO调度器支持：${{ github.event.inputs.adios_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}
          - BakaSU管理器下载：[BakaSU_CI](https://github.com/cctv18/BakaSU_CI/releases)
          - SukiSU Ultra管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)
          - midori01/KernelSU管理器下载：[KernelSU (midori)](https://github.com/midori01/KernelSU/releases)
          - FinaSU管理器下载：[FinaSU](https://github.com/LyraVoid/FinaSU/releases)
          
          ### ⏫️ 更新内容：
          - 更新${{ env.KSU_TYPENAME }}至最新版本（${{ needs.build.outputs.ksuver }}）
          - (预留)
          
          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
          3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启；
          4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
          5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器（包括除KernelSU Next以外的各分支）需要配合元模块(metamodule)才能正常挂载模块。目前的元模块包括[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta-magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount)等。若你是第一次使用KSU或刚从旧版KSU管理器升级至新版，请先安装一个元模块，这样其他涉及系统挂载的模块才能正常运行；
          6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，可以运行在任意KSU/面具环境中（不适用于Apatch），且不能与(Re)SukiSU内置的kpm功能共同使用，使用前请保证你的内核没有内置的kpm实现/修补。
          
          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
